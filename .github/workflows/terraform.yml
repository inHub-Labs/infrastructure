name: Terraform Governance

on:
  pull_request:
    branches:
      - feature/github-app
  push:
    branches:
      - main
      - feature/github-app

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_github_organization: ${{ github.repository_owner }}
          GITHUB_APP_ID: ${{ secrets.TF_GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.TF_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PEM_FILE: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}

      - name: Upload Terraform plan artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/github-app'
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: tfplan
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/github-app'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@v7
        with:
          name: tfplan
          path: .

      - name: Terraform Apply
        run: terraform apply tfplan
        env:
          TF_VAR_github_organization: ${{ github.repository_owner }}
          GITHUB_APP_ID: ${{ secrets.TF_GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.TF_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PEM_FILE: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
